<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkinType Cabinet</title>
<style>
:root{--bg:#f5f2ee;--card:#fff;--ink:#262321;--muted:#706b66;--accent:#765d48;--soft:#eee7e0;--line:#ddd6cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(35px + env(safe-area-inset-bottom))}
.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--accent)}
h1{font-size:29px;line-height:1.1;margin:7px 0 5px}.intro{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 30px #00000008}
.progress-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px}.progress{height:7px;background:var(--soft);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}
.q{font-size:22px;line-height:1.3;margin:24px 0 17px}.opts{display:grid;gap:10px}.opt{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px;text-align:left;font-size:16px;line-height:1.3;cursor:pointer}.opt.sel{background:#f0e8e0;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.nav{display:flex;gap:10px;margin-top:20px}.action{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px}.back{background:var(--soft)}.next{background:var(--accent);color:#fff}.action:disabled{opacity:.4}
.hide{display:none}.result h2{font-size:29px;margin:4px 0}.pill{display:inline-block;background:var(--soft);padding:7px 10px;border-radius:999px;font-size:13px;margin:4px 4px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.metric{border:1px solid var(--line);border-radius:14px;padding:13px;font-size:13px;color:var(--muted)}.metric b{display:block;color:var(--ink);font-size:15px;margin-top:4px}.track{height:7px;background:var(--soft);border-radius:7px;margin-top:8px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent)}
.block{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.block h3{font-size:17px;margin:0 0 9px}ul{padding-left:20px;line-height:1.55}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit}.small{font-size:12px;color:var(--muted);line-height:1.5}
.actions2{display:flex;gap:10px;margin-top:20px}.actions2 button{flex:1;border:0;border-radius:13px;padding:13px;font-weight:800}.green{background:#5d735e;color:#fff}
@media(max-width:560px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0}.no-print{display:none!important}}
</style></head><body><div class="wrap">
<div class="brand">SkinType Cabinet</div><h1>Bilan cutané</h1><p class="intro">Questionnaire d'orientation pour compléter l'évaluation clinique du praticien.</p>
<section id="quiz" class="card"><div class="progress-top"><span id="counter"></span><span id="percent"></span></div><div class="progress"><i id="pbar"></i></div>
<h2 id="q" class="q"></h2><div id="opts" class="opts"></div><div class="nav"><button id="back" class="action back">← Précédent</button><button id="next" class="action next" disabled>Suivant →</button></div></section>
<section id="result" class="card hide"></section></div>
<script>
const questions=[["Après un nettoyage doux, sans appliquer de produit pendant environ 30 minutes, votre peau…", ["Tire nettement", "Est confortable", "Brille surtout sur le front et le nez", "Devient brillante sur la majorité du visage"]], ["En fin de journée, la brillance de votre peau est généralement…", ["Quasi absente", "Faible", "Importante sur la zone T", "Importante sur presque tout le visage"]], ["Vos joues sont le plus souvent…", ["Sèches ou inconfortables", "Confortables", "Normales à légèrement sèches, avec une zone T plus grasse", "Brillantes ou grasses"]], ["Vos pores sont plutôt…", ["Peu visibles", "Peu à modérément visibles", "Visibles surtout sur la zone T", "Visibles sur une grande partie du visage"]], ["Après plusieurs heures sans hydratant, vous ressentez…", ["Un tiraillement marqué", "Un léger manque de confort", "Peu de changement", "Aucun manque de confort"]], ["Votre peau peut-elle être brillante tout en donnant une sensation de manque d'eau ?", ["Souvent", "Parfois", "Rarement", "Jamais"]], ["Votre peau réagit-elle facilement aux cosmétiques ?", ["Très facilement", "Assez facilement", "Peu", "Presque jamais"]], ["Le froid, la chaleur ou les changements de température provoquent-ils des réactions ?", ["Très souvent", "Parfois", "Rarement", "Jamais"]], ["Avez-vous des rougeurs visibles ou des sensations de chaleur ?", ["Souvent", "Parfois", "Rarement", "Jamais"]], ["Avez-vous des points noirs, microkystes ou pores obstrués ?", ["Très souvent", "Régulièrement", "Occasionnellement", "Jamais ou presque"]], ["Avez-vous des boutons inflammatoires actuellement ?", ["Souvent", "Quelques-uns régulièrement", "Occasionnellement", "Non"]], ["Après un produit cosmétique nouveau, avez-vous déjà eu démangeaisons, brûlures ou plaques ?", ["Souvent", "Parfois", "Rarement", "Jamais"]], ["Votre peau présente-t-elle des taches brunes ou une pigmentation irrégulière ?", ["Marquée", "Modérée", "Légère", "Non"]], ["Après une exposition solaire, vous avez tendance à…", ["Développer facilement des taches", "Bronzer et parfois pigmenter", "Peu pigmenter", "Ne pas remarquer de pigmentation"]], ["Concernant les ridules, vous observez…", ["Peu ou pas de signes", "Quelques ridules", "Des ridules visibles", "Des ridules marquées"]], ["La fermeté cutanée vous semble…", ["Bonne", "Légèrement diminuée", "Modérément diminuée", "Nettement diminuée"]], ["La texture de votre peau est-elle irrégulière ?", ["Très peu", "Un peu", "Modérément", "Beaucoup"]], ["Avez-vous des cicatrices ou marques post-acnéiques ?", ["Nombreuses", "Quelques-unes", "Très peu", "Non"]], ["Votre peau supporte-t-elle bien les actifs comme les rétinoïdes ou les acides ?", ["Très mal", "Moyennement", "Plutôt bien", "Très bien"]], ["Votre objectif principal aujourd'hui est…", ["Hydratation / confort", "Pores / imperfections", "Taches / teint", "Rides / fermeté"]], ["Avez-vous une affection cutanée connue nécessitant un suivi médical ?", ["Oui", "Non", "Je ne sais pas", "Je préfère en discuter avec le praticien"]], ["Utilisez-vous actuellement un traitement ou un actif dermatologique important ?", ["Oui", "Non", "Je ne sais pas", "Je préfère en discuter avec le praticien"]], ["Votre peau a-t-elle récemment changé de façon inhabituelle ?", ["Oui, nettement", "Oui, légèrement", "Non", "Je ne sais pas"]], ["Quel est votre niveau d'exposition solaire habituel ?", ["Faible", "Modéré", "Important", "Très important"]], ["Utilisez-vous quotidiennement une protection solaire visage ?", ["Oui, SPF 50+", "Oui, mais pas tous les jours", "SPF inférieur", "Non"]]];
const maps=[[{"dry": 3}, {"normal": 3}, {"comb": 3}, {"oily": 3}], [{"dry": 2}, {"normal": 2}, {"comb": 2}, {"oily": 2}], [{"dry": 2}, {"normal": 2}, {"comb": 2}, {"oily": 2}], [{"normal": 1}, {"normal": 1}, {"comb": 2}, {"oily": 2}], [{"dehyd": 3}, {"dehyd": 2}, {"dehyd": 0}, {"dehyd": 0}], [{"dehyd": 3}, {"dehyd": 2}, {"dehyd": 1}, {"dehyd": 0}], [{"sens": 3}, {"sens": 2}, {"sens": 1}, {"sens": 0}], [{"sens": 3}, {"sens": 2}, {"sens": 1}, {"sens": 0}], [{"red": 3}, {"red": 2}, {"red": 1}, {"red": 0}], [{"comed": 3}, {"comed": 2}, {"comed": 1}, {"comed": 0}], [{"acne": 3}, {"acne": 2}, {"acne": 1}, {"acne": 0}], [{"sens": 3}, {"sens": 2}, {"sens": 1}, {"sens": 0}], [{"pig": 3}, {"pig": 2}, {"pig": 1}, {"pig": 0}], [{"pig": 3}, {"pig": 2}, {"pig": 1}, {"pig": 0}], [{"age": 0}, {"age": 1}, {"age": 2}, {"age": 3}], [{"age": 0}, {"age": 1}, {"age": 2}, {"age": 3}], [{"texture": 0}, {"texture": 1}, {"texture": 2}, {"texture": 3}], [{"scar": 3}, {"scar": 2}, {"scar": 1}, {"scar": 0}], [{"sens": 3}, {"sens": 2}, {"sens": 1}, {"sens": 0}], [{}, {}, {}, {}], [{}, {}, {}, {}], [{}, {}, {}, {}], [{}, {}, {}, {}], [{}, {}, {}, {}], [{}, {}, {}, {}]];
let idx=0,answers=Array(questions.length).fill(null);
const $=id=>document.getElementById(id);
function render(){const item=questions[idx];$("counter").textContent="Question "+(idx+1)+" / "+questions.length;$("percent").textContent=Math.round((idx+1)/questions.length*100)+" %";$("pbar").style.width=((idx+1)/questions.length*100)+"%";$("q").textContent=item[0];$("opts").innerHTML="";
item[1].forEach((text,n)=>{const b=document.createElement("button");b.className="opt"+(answers[idx]===n?" sel":"");b.textContent=text;b.onclick=()=>{answers[idx]=n;render()};$("opts").appendChild(b)});
$("back").disabled=idx===0;$("next").disabled=answers[idx]===null;$("next").textContent=idx===questions.length-1?"Voir mon bilan →":"Suivant →";}
function calculate(){let s={dry:0,normal:0,comb:0,oily:0,dehyd:0,sens:0,red:0,comed:0,acne:0,pig:0,age:0,texture:0,scar:0};answers.forEach((a,i)=>{if(a===null)return;Object.entries(maps[i][a]).forEach(([k,v])=>s[k]+=v)});return s}
function lvl(v,max){const p=Math.round(v/max*100);return[p,p<25?"Faible":p<60?"Modéré":"Élevé"]}
function showResult(){const s=calculate();const base=["dry","normal","comb","oily"].sort((a,b)=>s[b]-s[a])[0];const names={dry:"sèche",normal:"normale",comb:"mixte",oily:"grasse"};
let tags=[];if(s.dehyd>=4)tags.push("déshydratation");if(s.sens>=5)tags.push("sensibilité / réactivité");if(s.red>=3)tags.push("tendance aux rougeurs");if(s.comed>=3)tags.push("tendance comédonienne");if(s.acne>=2)tags.push("imperfections inflammatoires");if(s.pig>=3)tags.push("tendance pigmentaire");if(s.age>=3)tags.push("photo-vieillissement");if(s.texture>=2)tags.push("texture irrégulière");if(s.scar>=2)tags.push("marques / cicatrices");
const defs=[["dehyd","Déshydratation",8],["sens","Sensibilité",9],["red","Rougeurs",6],["comed","Comédons / pores",9],["acne","Imperfections",3],["pig","Pigmentation",6],["age","Photo-vieillissement",6],["texture","Texture",3],["scar","Marques / cicatrices",3]];
let metrics=defs.map(d=>{const x=lvl(s[d[0]],d[2]);return '<div class="metric">'+d[1]+'<b>'+x[1]+'</b><div class="track"><i style="width:'+x[0]+'%"></i></div></div>'}).join("");
const rec={dry:["Nettoyant doux non décapant","Hydratation et soutien de la barrière cutanée","Éviter les routines trop agressives"],normal:["Routine simple et régulière","Hydratation adaptée au confort","Photoprotection quotidienne"],comb:["Nettoyage doux","Hydratation légère sur l'ensemble du visage","Adapter les textures selon les zones"],oily:["Nettoyant doux","Hydratant léger non comédogène","Éviter le sur-nettoyage"]}[base];
let orient=[];if(s.dehyd>=4)orient.push("Hydratation / skinbooster : à discuter selon l'examen clinique");if(s.texture>=2||s.comed>=3)orient.push("Peelings, microneedling ou technologies de texture : selon indication");if(s.pig>=3)orient.push("Photoprotection renforcée et prise en charge de la pigmentation");if(s.age>=3)orient.push("Prévention / stimulation cutanée : selon l'évaluation du praticien");if(s.red>=3||s.sens>=5)orient.push("Préparation et stabilisation de la barrière cutanée avant procédure");if(!orient.length)orient.push("Aucune orientation spécifique déduite du questionnaire.");
let warning="";if(answers[20]===0||answers[22]===0){warning='<div class="block"><h3>⚠️ À vérifier par le praticien</h3><ul>';if(answers[20]===0)warning+="<li>Affection cutanée connue à préciser.</li>";if(answers[22]===0)warning+="<li>Changement cutané récent inhabituel à évaluer.</li>";warning+="</ul></div>"}
$("quiz").classList.add("hide");$("result").classList.remove("hide");
$("result").innerHTML='<div class="small">Bilan cutané</div><h2>Peau '+names[base]+'</h2><div>'+(tags.length?tags.map(t=>'<span class="pill">'+t+"</span>").join(""):'<span class="pill">Profil globalement équilibré</span>')+'</div><div class="grid"><div class="metric">Type de peau<b>'+names[base]+"</b></div>"+metrics+'</div><div class="block"><h3>Besoins prioritaires</h3><ul>'+rec.map(x=>"<li>"+x+"</li>").join("")+'</ul></div><div class="block"><h3>Orientation esthétique potentielle</h3><ul>'+orient.map(x=>"<li>"+x+"</li>").join("")+'</ul></div>'+warning+'<div class="block no-print"><h3>Analyse du praticien</h3><textarea placeholder="Observations cliniques, diagnostic, stratégie proposée…"></textarea></div><div class="block"><p class="small"><b>Important :</b> ce questionnaire est un outil d'aide à l'orientation. Il ne constitue pas un diagnostic médical et ne remplace pas l'interrogatoire ni l'examen clinique.</p></div><div class="actions2 no-print"><button class="back" onclick="restart()">↻ Nouvelle analyse</button><button class="green" onclick="window.print()">🖨 Imprimer / PDF</button></div>'}
function restart(){answers=Array(questions.length).fill(null);idx=0;$("result").classList.add("hide");$("quiz").classList.remove("hide");render()}
$("back").onclick=()=>{if(idx){idx--;render()}};$("next").onclick=()=>{if(idx<questions.length-1){idx++;render()}else showResult()};render();
</script></body></html>
